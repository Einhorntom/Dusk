[package]
name = "dusk-ipc"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
log = "0.4"
dusk-app = { path = "../app" }
dusk-domain = { path = "../domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }

[dev-dependencies]
dusk-ddc-fake = { path = "../ddc-fake" }
