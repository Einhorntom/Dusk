[package]
name = "dusk-bin-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "duskd"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
log = "0.4"
dusk-app = { path = "../app" }
dusk-domain = { path = "../domain" }
dusk-ddc-fake = { path = "../ddc-fake" }
dusk-ddc-windows = { path = "../ddc-windows" }
dusk-panel-windows = { path = "../panel-windows" }
dusk-ipc = { path = "../ipc" }
dusk-store-file = { path = "../store-file" }
dusk-ui-win32 = { path = "../ui-win32" }

[dev-dependencies]
dusk-cli = { path = "../cli" }
serde_json = "1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
