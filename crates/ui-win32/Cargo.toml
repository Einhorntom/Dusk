[package]
name = "dusk-ui-win32"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
log = "0.4"
dusk-app = { path = "../app" }
dusk-domain = { path = "../domain" }
dusk-ui-model = { path = "../ui-model" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
