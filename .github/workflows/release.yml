name: Release

# Publishes a GitHub Release when a version tag is pushed:
#   python scripts/set_version.py 1.2.3   (commit it)
#   git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "VERSION=$version" >> $env:GITHUB_ENV
          python scripts/set_version.py --check $version

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The same gate as CI, so a release is never built from failing code.
      - name: Test
        run: cargo test --workspace

      - name: Build executables (release profile)
        run: cargo build --release --bins

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build integrations
        run: |
          dotnet build integrations/PowerToysRun/Dusk.PowerToysRun.csproj -c Release -p:Platform=x64
          dotnet build integrations/CommandPalette/Dusk.CommandPalette.csproj -c Release -p:Platform=x64

      - name: Test integrations against the release daemon
        run: dotnet test integrations/Dusk.Client.Tests -c Release
        env:
          DUSKD_EXE: ${{ github.workspace }}\target\release\duskd.exe

      - name: Package
        shell: pwsh
        run: ./scripts/package_release.ps1 -Version $env:VERSION

      # The Microsoft Store package. Unsigned (the Store signs it), so it is
      # a workflow artifact to upload in Partner Center, not a release asset.
      - name: Package for the Microsoft Store
        shell: pwsh
        run: ./scripts/package_msix.ps1 -Version $env:VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: Dusk-${{ env.VERSION }}-x64-msix
          path: dist/Dusk-${{ env.VERSION }}-x64.msix
          if-no-files-found: error

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' "dist/Dusk-$env:VERSION-x64.zip" "dist/Dusk-$env:VERSION-x64.zip.sha256" `
            --title "Dusk $env:VERSION" --generate-notes
