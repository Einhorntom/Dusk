name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  windows:
    name: Windows (fmt, layering, clippy, test, build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Dependency rule (ARCH.md 5.3)
        run: python scripts/check_layers.py

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # No test writes to a physical monitor: monitor tests use ddc-fake and
      # the named-pipe tests use private pipe names.
      - name: Test
        run: cargo test --workspace

      - name: Build executables
        run: cargo build --workspace --bins

      # PowerToys integrations (C#). The client tests include a contract test
      # against the dispcontrold built above, run with simulated monitors.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build integrations
        run: dotnet build integrations/Dispcontrol.Integrations.sln -c Release -p:Platform=x64

      - name: Test integrations
        run: dotnet test integrations/Dispcontrol.Integrations.sln -c Release -p:Platform=x64 --no-build
        env:
          DISPCONTROLD_EXE: ${{ github.workspace }}\target\debug\dispcontrold.exe
