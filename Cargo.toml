[workspace]
members = [
    "crates/domain",
    "crates/app",
    "crates/ddc-fake",
    "crates/mccs",
    "crates/ddc-windows",
    "crates/panel-windows",
    "crates/ipc",
    "crates/store-file",
    "crates/cli",
    "crates/bin-cli",
    "crates/bin-daemon",
    "crates/ui-model",
    "crates/ui-win32",
]
# The Phase 0 hardware spike is kept for reference and builds on its own.
exclude = ["spikes/windows-ddc"]
resolver = "3"

# One version for every crate; the Settings window and `dusk version` show it.
[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# The daemon has no console: diagnostics go through `log` (SPEC-NFR-3).
# Only the CLI prints, and allows it where it does.
print_stderr = "deny"
print_stdout = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
